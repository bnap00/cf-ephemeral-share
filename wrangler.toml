name = "ephemeral-files"
main = "src/index.js"
compatibility_date = "2026-08-26"

# Static UI (public/) is served from Cloudflare's edge; the Worker only runs
# for /api/* and for the /f/<id> share pages.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ephemeral-files"

[[kv_namespaces]]
binding = "META"
# Cloudflare's deploy button replaces this placeholder with a new namespace ID.
# For a manual deployment, create a namespace and paste its ID here.
id = "00000000000000000000000000000000"

# Hourly sweep: deletes expired objects and aborts stale multipart uploads.
[triggers]
crons = ["17 * * * *"]

# Keep Worker logs (errors, sweep results) so failures are visible without a
# live `wrangler tail`. The Worker keeps share ids, tokens and keys out of its
# own log lines. Invocation logs stay off: they record every request's full
# URL, and share ids are in the URL.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[vars]
# Hard cap per file, in MiB.
MAX_SIZE_MB = "5120"
# Optional instance branding. Text is rendered as plain text, colors must be
# six-digit hex values, and the logo must be a path inside public/.
# BRAND_NAME = "Acme Share"
# BRAND_TAGLINE = "Private transfers for the Acme team."
# BRAND_FOOTER = "Encrypted in your browser. Stored as ciphertext."
# BRAND_LOGO = "/acme-logo.svg"
# BRAND_ACCENT = "#8a3ffc"
# BRAND_ACCENT_DARK = "#be95ff"
# Uploads are owner-only and fail closed. Nobody can upload until you run:
#   npm run token
#   npx wrangler secret put UPLOAD_TOKEN
# Anyone with a share link can download its contents.
#
# Resume tickets for interrupted downloads are signed with a random secret the
# Worker creates on first use and keeps in KV (k:ticket-secret), bound to
# UPLOAD_TOKEN. To pin it instead, `npx wrangler secret put TICKET_SECRET` with
# a long random value. Rotating either one only makes a download in progress
# start over.
#
# Shares uploaded by current clients are bound to their link key: a download
# that presents the wrong key is refused without spending a view. Downloads
# that present no key at all (older CLI copies, app pages cached before the
# change) are still allowed. Some days after deploying, once cached clients
# have refreshed, uncomment this to refuse them too. Shares uploaded before
# the change are never challenged either way.
# DOWNLOAD_AUTH = "enforce"

# Optional strongly consistent download counter. Without it, limits are counted
# in KV, which is eventually consistent: two downloads racing on a one-read link
# from different locations can both be served. With it, each limited share gets
# a Durable Object that claims downloads one at a time; links created before it
# was enabled keep their remaining count, and downloads counted in KV while it
# was removed still count when it comes back. Unlimited shares never use it. To turn
# it on, uncomment both blocks and deploy. Keep the migration block even if you
# later remove the binding; deleting the class needs a deleted_classes migration.
# [[durable_objects.bindings]]
# name = "COUNTER"
# class_name = "DownloadCounter"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["DownloadCounter"]

# Optional per-IP throttles. Uncomment to enable; without them the Worker still
# works without rate limiting. Pick namespace IDs unique to this application.
# UPLOAD_LIMIT counts upload inits and token checks: a bundle of N files costs
# N+1 inits (one per file plus the index), so leave room for your largest bundle.
# DOWNLOAD_LIMIT also throttles share metadata lookups, on a separate counter.
# [[ratelimits]]
# binding = "UPLOAD_LIMIT"
# namespace_id = "1001"
# simple = { limit = 120, period = 60 }
#
# [[ratelimits]]
# binding = "DOWNLOAD_LIMIT"
# namespace_id = "1002"
# simple = { limit = 60, period = 60 }
